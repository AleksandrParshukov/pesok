<section class="booking">
  <h2 class="title-out">[ Обратная связь ]</h2>
  <div class="wrapper">
    <p class="h1">Хотите арендовать площадку?</p>

    <form class="booking__form" action="">
      <input class="booking__input" type="text" placeholder="ВАШЕ ИМЯ:">
      <input class="booking__input js_phone_input" type="tel" placeholder="НОМЕР ТЕЛЕФОНА:">
      <select class="js_custom_select" name="" id="" data-placehoder="ВЫБЕРИТЕ ВИД СПОРТА">
        <option value="valleyball">Волейбол</option>
        <option value="football">Футбол</option>
      </select>
      <textarea class="booking__input" name="" id="" rows="5" placeholder="КОММЕНТАРИЙ:"></textarea>

      <button type="submit" class="btn btn-black">ОТПРАВИТЬ</button>
      <div class="checkbox">
        <input type="checkbox" name="" id="booking_policy">
        <label for="booking_policy">Согласие на обработку персональных данных</label>
      </div>
    </form>
  </div>
</section>
